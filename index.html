<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zara - Desktop Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        background: transparent !important;
        overflow: hidden;
        font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif;
      }

      #root {
        width: 100vw;
        height: 100vh;
        background: transparent !important;
      }

      /* ===== Character Animations ===== */
      @keyframes floatHeart {
        0% { transform: translateY(0) scale(1); opacity: 0.8; }
        50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
        100% { transform: translateY(-40px) scale(0.8); opacity: 0; }
      }

      @keyframes sparkle {
        0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
        50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
        100% { transform: scale(0.5) rotate(360deg); opacity: 0; }
      }

      @keyframes angerPulse {
        0%, 100% { transform: scale(1) rotate(0deg); }
        25% { transform: scale(1.3) rotate(-5deg); }
        50% { transform: scale(1) rotate(5deg); }
        75% { transform: scale(1.3) rotate(-3deg); }
      }

      @keyframes tearDrop {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(30px); opacity: 0; }
      }

      @keyframes moodBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      /* ===== Chat Bubble Animations ===== */
      @keyframes bubbleAppear {
        from {
          opacity: 0;
          transform: translate(-50%, -90%) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -100%) scale(1);
        }
      }

      @keyframes dotPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      /* ===== Input Animations ===== */
      @keyframes inputSlideUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      /* ===== Walking Bounce ===== */
      @keyframes walkBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      /* ===== Breathing (idle) ===== */
      @keyframes breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.02); }
      }

      /* ===== Fade Animations ===== */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }

      /* ===== Settings Panel Styles ===== */
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(167, 139, 250, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(167, 139, 250, 0.5);
      }

      /* ===== Reminder Point Pulse ===== */
      @keyframes reminderPulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      }

      @keyframes ringExpand {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
        100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
      }

      /* ===== Dance Glow ===== */
      @keyframes danceGlow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(244,114,182,0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(244,114,182,0.8)); }
      }

      /* ===== Sleep ZZZ ===== */
      @keyframes floatZZZ {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translateY(-30px) scale(1.2); opacity: 0; }
      }

      /* ===== Big Screen Mode ===== */
      @keyframes bigScreenIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1.8); opacity: 1; }
      }

      /* ===== Chibi Bounce ===== */
      @keyframes chibiBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      /* Input styling */
      input:focus, select:focus {
        border-color: #a78bfa !important;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      select option {
        background: #1a1a2e;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
